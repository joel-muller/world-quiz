@if (!success()) {
  <h2>Reset Password</h2>

  <form [formGroup]="form" (ngSubmit)="resetPassword()">
    <input type="password" formControlName="password1" placeholder="New password" />

    <input type="password" formControlName="password2" placeholder="Repeat new password" />

    <button type="submit" [disabled]="loading()">Reset Password</button>
  </form>
} @else {
  <p>{{ success() }}</p>
}

@if (error(); as e) {
  <p style="color: red">{{ e }}</p>
}
